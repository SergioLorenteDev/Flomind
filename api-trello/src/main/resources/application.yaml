spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath*:database/schema.sql
      data-locations: classpath*:database/migrations.sql
      mode: always
  datasource:
    url: jdbc:mysql://localhost:3306/trello
    username: root
    password:
    driverClassName: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ***REMOVED***
    password: ***REMOVED***
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  
            client-secret:
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

security:
  jwt:
    secret-key: ***REMOVED***
    expiration-time: 3600000
    refresh-expiration-time: 2592000000

app:
  base-url: http://localhost:8080/trello/v1/
  domain:
    success-url: http://localhost:3000/suscripcion/exito
    cancel-url: http://localhost:3000/suscripcion/fallo
    oauth-success-url: http://localhost:3000/oauth-callback

stripe:
  api:
    secretKey: sk_test_TU_CLAVE_SECRETA_COMPLETA_AQUI
  webhook:
    secret: ***REMOVED***