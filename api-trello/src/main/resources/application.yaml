spring:
  # Carga api-trello/.env (ignorado por git) para no versionar credenciales.
  # Copia example.env a .env y rellena ahi tus valores.
  config:
    import: optional:file:.env[.properties]
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath*:database/schema.sql
      data-locations: classpath*:database/migrations.sql
      mode: always
  datasource:
    url: jdbc:mysql://localhost:3306/trello
    username: root
    password: ${MYSQL_PASSWORD:}
    driverClassName: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

security:
  jwt:
    # Obligatorio: define JWT_SECRET_KEY en Base64. Genera uno con:
    #   openssl rand -base64 64
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 3600000
    refresh-expiration-time: 2592000000

app:
  base-url: ${BASE_URL}/
  domain:
    success-url: http://localhost:3000/suscripcion/exito
    cancel-url: http://localhost:3000/suscripcion/fallo
    oauth-success-url: http://localhost:3000/oauth-callback

stripe:
  api:
    secretKey: ${STRIPE_SECRET_KEY}
  webhook:
    # Secreto de firma del webhook de Stripe (whsec_...). Opcional en local.
    secret: ${STRIPE_WEBHOOK_SECRET:}
